<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, system-ui, sans-serif; padding: 10px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    button { background: #0071dc; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 13px; }
    button:hover:enabled { background: #0056a8; }
    button:disabled { background: #9bb8d4; cursor: default; }
    #status { font-size: 12px; margin: 8px 0 4px; color: #333; word-break: break-word; }
    #status.error { color: #b3261e; }
    #summary { font-size: 12px; max-height: 220px; overflow-y: auto; }
    #summary > div { padding: 1px 0; }
    #summary .k { display: inline-block; width: 84px; color: #666; }
    #summary .refurb { color: #0a7c42; }
    pre { text-align: left; background: #f4f4f4; padding: 6px; font-size: 11px; max-height: 180px; overflow: auto; display: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h3>Product Data Grabber</h3>
  <button id="scrape-btn">Scrape this page</button>
  <p id="status">Open any product page, then click above.</p>
  <div id="summary"></div>
  <pre id="output"></pre>
  <script src="popup.js"></script>
</body>
</html>
